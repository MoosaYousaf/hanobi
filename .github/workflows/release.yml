# Builds unsigned macOS releases when a version tag is pushed (git tag v0.4.0 && git push --tags).
# Hanobi's update check reads these releases.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build && npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/*.dmg dist/release/*.zip --title "Hanobi ${GITHUB_REF_NAME#v}" --generate-notes
