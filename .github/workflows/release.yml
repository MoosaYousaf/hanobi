# Build without release credentials, then publish only the resulting artifacts.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build && npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - name: Checksum release files
        working-directory: dist/release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-release
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt --title "Orin ${GITHUB_REF_NAME#v}" --generate-notes
